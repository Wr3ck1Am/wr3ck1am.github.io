<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, noarchive">
  <meta name="theme-color" content="#f8f7f3">
  <title>Request a CV | Jinglin Cao</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=9">
  <style>
    .cv-request{width:min(540px,calc(100% - 40px));margin:clamp(48px,14vh,140px) auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:8px;border-top:3px solid var(--blue)}
    .cv-request .wordmark{width:fit-content;margin-bottom:40px}
    .cv-request h1{font:600 clamp(28px,5vw,36px)/1.2 var(--display);letter-spacing:-1px;margin:10px 0 16px}
    .cv-request p{color:var(--secondary);margin:10px 0}
    .cv-request .cv-request-zh{font-size:13px;line-height:1.8}
    .cv-request .cv-request-email{display:inline-block;color:var(--blue);font-weight:500;border-bottom:1px solid #b5c0fc;overflow-wrap:anywhere;margin:12px 0 30px}
    .cv-request .cv-request-back{display:block;width:fit-content;font-size:12px;color:var(--muted)}
    @media(max-width:400px){.cv-request{padding:24px}}
  </style>
</head>
<body>
  <main class="cv-request">
    <a class="wordmark" href="./" aria-label="Jinglin Cao home"><span class="monogram" aria-hidden="true">jc<span>↗</span></span><span>Jinglin Cao</span></a>
    <p class="eyebrow">CURRICULUM VITAE</p>
    <h1>Available on request<span class="name-period">.</span></h1>
    <p>Please email me to request a copy of my CV.</p>
    <p class="cv-request-zh" lang="zh-CN">简历可通过邮件索取，欢迎联系。</p>
    <a class="cv-request-email" href="mailto:williamcao1943@gmail.com?subject=CV%20request">williamcao1943@gmail.com <span aria-hidden="true">↗</span></a>
    <a class="cv-request-back" href="./">← Homepage / <span lang="zh-CN">返回主页</span></a>
  </main>
</body>
</html>
